<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            transition: all 0.3s ease;
        }
        .rouge{
            background-color: red;
        }

        .modale{
            background-color: rgba(0,0,0,0.5);
            position: absolute;
            z-index: 2;
            inset: 0;

            display: none;
            justify-content: center;
            align-items: center;
        }

        .modale div{
            background-color: white;
            padding: 50px;
            max-width: 600px;
        }

        .modale.visible{
            display: flex;
        }

        .rectangle{
            width: 300px;
            height: 100px;
            background-color: red;
            transition: all 0.3s ease;
        }
        .vert{
            background-color: green;
        }
        .hide{
            opacity: 0;
        }

        nav{
            position: absolute;
            top: 0;
            bottom: 0;
            right: -300px;
            width: 300px;
            background-color: lightgray;
            z-index: 1;

            transition: right 0.3s ease;
        }

        #burger{
            position: absolute;
            z-index: 3;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 16px;
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
        }

        #burger span{
            width: 100%;
            height: 3px;
            background-color: black;
            transition: all 0.3s ease;
        }

        body.menu_visible{
            overflow-y: hidden;
        }
        body.menu_visible nav{
            right: 0px;
        }
        body.menu_visible #burger span:nth-child(1){
            transform: rotate(45deg);
            transform-origin: top left;
        }
        body.menu_visible #burger span:nth-child(2){
            display: none;
        }
        body.menu_visible #burger span:nth-child(3){
            transform: rotate(-45deg);
            transform-origin: bottom left;
        }
    </style>
</head>
<body>
    <button id="ex1">Exercice 1</button>
    <button class="ex2">Ouvrir la modale</button>

    <div class="modale">
        <div>
            <p>Modale</p>
            <button class="ex2">Fermer la modale</button>
        </div>
    </div>

    <h2>Exercice 3</h2>

    <div class="rectangle"></div>
    <button id="vert">Vert</button>
    <button id="initial">Couleur initiale</button>
    <button id="hide">Disparait</button>
    <button id="show">Affiche</button>

    <div id="burger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav id="nav">
        <ul>
            <li><a href="">Accueil</a></li>
            <li><a href="">A propos</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </nav>

    <script src="css.js"></script>
</body>
</html>
